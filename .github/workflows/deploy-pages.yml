name: Publish Urbexity to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Set API origin
        env:
          URBEXITY_API_ORIGIN: ${{ vars.URBEXITY_API_ORIGIN }}
        run: node -e 'require("node:fs").writeFileSync("public/config.js", "window.URBEXITY_API_ORIGIN = " + JSON.stringify(process.env.URBEXITY_API_ORIGIN || "") + ";\n")'
      - name: Add SPA fallback
        run: cp public/index.html public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
